<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Загрузка">
  <title>FlareonFit loader — кольцо</title>
  <defs>
    <linearGradient id="flareonRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F58A3C"/>
      <stop offset="100%" stop-color="#4CB558"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="76" fill="none" stroke="#F58A3C" stroke-opacity="0.16" stroke-width="16"/>

  <g transform="rotate(-90 100 100)">
    <circle cx="100" cy="100" r="76" fill="none" stroke="url(#flareonRing)" stroke-width="16"
            stroke-linecap="round" stroke-dasharray="80 398">
      <animate attributeName="stroke-dasharray"
               values="40 438;300 178;40 438" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset"
               values="0;-160;-478" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate"
                      values="-90 100 100;270 100 100" dur="1.8s" repeatCount="indefinite"/>
  </g>
</svg>
