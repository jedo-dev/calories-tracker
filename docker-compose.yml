version: "3.3"

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY}; do sleep 1; done;
      mc mb --ignore-existing local/recipes;
      mc anonymous set download local/recipes;
      exit 0"

  api:
    image: calories-tracker-api:latest
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - minio
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      S3_ENDPOINT: http://minio:9000
      # Public base URL for stored photo links, e.g. https://example.com/s3 (nginx proxies /s3/ to minio)
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_BUCKET: ${S3_BUCKET:-recipes}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      # AI-распознавание еды по фото (Polza.ai, OpenAI-совместимый API)
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-anthropic/claude-sonnet-4.5}
      # Web Push (сгенерировать: npx web-push generate-vapid-keys)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      # Почта (подтверждение регистрации)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      APP_URL: ${APP_URL}

  # Ежедневный дамп Mongo в отдельный volume (ротация 14 дней).
  # ВАЖНО: volume лежит на том же хосте — дампы нужно дополнительно
  # копировать наружу (см. LAUNCH_CHECKLIST.md).
  mongo-backup:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - mongo_backups:/backups
      - ./scripts/mongo-backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

  # Офсайт-копия дампов в Яндекс Object Storage (S3). Без BACKUP_S3_BUCKET
  # сервис спит и ничего не делает.
  backup-sync:
    image: rclone/rclone:latest
    restart: unless-stopped
    depends_on:
      - mongo-backup
    environment:
      RCLONE_CONFIG_YC_TYPE: s3
      RCLONE_CONFIG_YC_PROVIDER: Other
      RCLONE_CONFIG_YC_ENDPOINT: storage.yandexcloud.net
      RCLONE_CONFIG_YC_REGION: ru-central1
      RCLONE_CONFIG_YC_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY}
      RCLONE_CONFIG_YC_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
    volumes:
      - mongo_backups:/backups:ro
      - ./scripts/backup-sync.sh:/sync.sh:ro
    entrypoint: ["sh", "/sync.sh"]

  web:
    image: calories-tracker-web:latest
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3322}:80"

volumes:
  minio_data:
  mongo_backups:
